<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnotherNotes</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root {
        color-scheme: light dark;
        --bar: #f7f7f5; --ink: #37352f; --muted: rgba(55, 53, 47, .55); --hover: rgba(55, 53, 47, .07);
        --active: #ffffff; --edge: rgba(55, 53, 47, .09); --shade: 0 1px 2px rgba(0, 0, 0, .06);
      }
      :root.dark {
        --bar: #202020; --ink: rgba(255, 255, 255, .86); --muted: rgba(255, 255, 255, .46); --hover: rgba(255, 255, 255, .06);
        --active: rgba(255, 255, 255, .09); --edge: rgba(255, 255, 255, .08); --shade: none;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bar); color: var(--ink);
        font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default;
      }
      .bar {
        display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 var(--lights, 8px);
        border-bottom: 1px solid var(--edge); -webkit-app-region: drag;
      }
      body.over .bar { border-bottom-color: transparent; }
      body.hidden .bar { visibility: hidden; }
      button, .tab { -webkit-app-region: no-drag; }
      .icon {
        display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0;
        border: 0; border-radius: 6px; background: transparent; color: var(--ink);
      }
      .icon:hover:not(:disabled) { background: var(--hover); }
      .icon:disabled { color: var(--muted); opacity: .6; }
      .icon svg { width: 16px; height: 16px; }
      .nav { display: flex; gap: 2px; margin-right: 6px; }
      .tabs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
      .tab {
        position: relative; display: flex; align-items: center; gap: 6px; flex: 0 1 auto; width: 200px; min-width: 76px; height: 30px;
        padding: 0 6px 0 12px; border-radius: 8px; color: var(--muted); overflow: hidden;
        transition: background .12s, color .12s, width .18s ease, min-width .18s ease, padding .18s ease, opacity .14s ease;
      }
      /* A tab grows in as it opens and folds away as it closes, so the others slide over. */
      .tab.entering, .tab.leaving { width: 0; min-width: 0; padding-left: 0; padding-right: 0; opacity: 0; }
      .tab.leaving { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .tab { transition: background .12s, color .12s; } }
      .tab:hover { background: var(--hover); color: var(--ink); }
      .tab.active { background: var(--active); color: var(--ink); box-shadow: var(--shade), inset 0 0 0 1px var(--edge); }
      .tab .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 30px; }
      .tab .close {
        display: grid; place-items: center; flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px;
        background: transparent; color: var(--muted); visibility: hidden;
      }
      .tab:hover .close, .tab.active .close { visibility: visible; }
      .tab .close:hover { background: var(--hover); color: var(--ink); }
      .tab .close svg { width: 10px; height: 10px; }
      #new { margin-left: 2px; }
      /* Signing in: one tab of its own, with nothing to open, close or go back to. */
      .tab.fixed { width: 150px; padding: 0 12px 0 10px; }
      .tab.fixed.entering, .tab.fixed.leaving { width: 0; padding-left: 0; padding-right: 0; }
      .tab .glyph { flex: none; width: 14px; height: 14px; border-radius: 3.5px; }
      body.signin #new { display: none; }
      /* A dialog open in the page: its backdrop, carried over the bar, and no clicks through. */
      .scrim {
        position: fixed; inset: 0; z-index: 5; background: var(--scrim, transparent);
        opacity: 0; pointer-events: none; transition: opacity .15s ease;
      }
      body.modal .scrim { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body class="hidden">
    <div class="scrim" aria-hidden="true"></div>
    <div class="bar">
      <div class="nav">
        <button class="icon" id="back" type="button" title="Back (⌘[)" aria-label="Back" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button class="icon" id="forward" type="button" title="Forward (⌘])" aria-label="Forward" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5" /></svg>
        </button>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open notes"></div>
      <button class="icon" id="new" type="button" title="New note (⌘N)" aria-label="New note">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>
      </button>
    </div>
    <script>
      (function () {
        var bridge = window.tabbar;
        if (!bridge) return;
        var root = document.documentElement;
        var list = document.getElementById("tabs");
        var back = document.getElementById("back");
        var forward = document.getElementById("forward");
        var CLOSE = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="m2 2 6 6M8 2 2 8" /></svg>';

        back.addEventListener("click", function () { bridge.send("back"); });
        forward.addEventListener("click", function () { bridge.send("forward"); });
        document.getElementById("new").addEventListener("click", function () { bridge.send("new"); });

        /* The web app's sidebar colour, so the bar reads as part of the app. */
        function applyTheme(theme) {
          if (!theme || !theme.background) return;
          var m = theme.background.match(/\d+(\.\d+)?/g);
          var dark = theme.dark;
          if (m && m.length >= 3) {
            var lum = (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
            dark = lum < 0.5;
          }
          root.classList.toggle("dark", Boolean(dark));
          root.style.setProperty("--bar", theme.background);
        }

        /*
          The tabs are kept, not redrawn: an update changes only what changed, so a tab
          under the pointer stays hovered and a click on it is never lost to a redraw.
        */
        var els = new Map();

        function closeTab(id) {
          var el = els.get(id);
          if (el) fold(el, id);
          bridge.send("close", id);
        }

        function fold(el, id) {
          els.delete(id);
          el.classList.add("leaving");
          setTimeout(function () { el.remove(); }, 200);
        }

        function makeTab(id) {
          var el = document.createElement("div");
          el.className = "tab entering";
          el.setAttribute("role", "tab");
          var title = document.createElement("span");
          title.className = "title";
          var close = document.createElement("button");
          close.className = "close";
          close.type = "button";
          close.innerHTML = CLOSE;
          // Closing is its own gesture: it must not select the tab on its way out.
          close.addEventListener("mousedown", function (e) { e.stopPropagation(); });
          close.addEventListener("click", function (e) { e.stopPropagation(); closeTab(id); });
          el.addEventListener("mousedown", function (e) {
            if (e.button !== 0) return;
            els.forEach(function (other) { other.classList.toggle("active", other === el); });
            bridge.send("select", id);
          });
          el.addEventListener("auxclick", function (e) { if (e.button === 1) closeTab(id); });
          el.appendChild(title);
          el.appendChild(close);
          requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.remove("entering"); }); });
          return el;
        }

        /* While signing in the bar holds one tab, the sign-in screen, and nothing else. */
        var GLYPH = '<svg class="glyph" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="116" fill="#1E1E1E"/><path fill="#FFFFFF" d="M136 116a26 26 0 0 1 26-26h136l78 78v228a26 26 0 0 1-26 26H162a26 26 0 0 1-26-26V116Z"/><g fill="#1E1E1E"><rect x="176" y="212" width="160" height="22" rx="11"/><rect x="176" y="264" width="160" height="22" rx="11"/><rect x="176" y="316" width="98" height="22" rx="11"/></g></svg>';
        var signInTab = null;
        function drawSignIn(on) {
          document.body.classList.toggle("signin", on);
          if (on && !signInTab) {
            signInTab = document.createElement("div");
            signInTab.className = "tab fixed active entering";
            signInTab.setAttribute("role", "tab");
            signInTab.setAttribute("aria-selected", "true");
            signInTab.innerHTML = GLYPH + '<span class="title">Sign in</span>';
            list.insertBefore(signInTab, list.firstChild);
            var entering = signInTab;
            requestAnimationFrame(function () { requestAnimationFrame(function () { entering.classList.remove("entering"); }); });
          } else if (!on && signInTab) {
            var leaving = signInTab;
            signInTab = null;
            leaving.classList.add("leaving");
            setTimeout(function () { leaving.remove(); }, 200);
          }
        }

        function draw(state) {
          drawSignIn(Boolean(state.signIn));
          document.body.classList.toggle("hidden", !state.visible);
          document.body.classList.toggle("over", Boolean(state.overSidebar));
          root.style.setProperty("--lights", (state.inset || 8) + "px");
          applyTheme(state.theme);
          document.body.classList.toggle("modal", Boolean(state.scrim));
          if (state.scrim) root.style.setProperty("--scrim", state.scrim);
          back.disabled = !state.canGoBack;
          forward.disabled = !state.canGoForward;

          var wanted = new Set();
          var previous = null;
          state.tabs.forEach(function (tab) {
            wanted.add(tab.id);
            var el = els.get(tab.id);
            if (!el) {
              el = makeTab(tab.id);
              els.set(tab.id, el);
            }
            el.classList.toggle("active", tab.active);
            el.setAttribute("aria-selected", String(tab.active));
            if (el.title !== tab.title) {
              el.title = tab.title;
              el.firstChild.textContent = tab.title;
              el.lastChild.setAttribute("aria-label", "Close " + tab.title);
            }
            // In order, moving a tab only when it is out of place.
            var at = previous ? previous.nextSibling : signInTab ? signInTab.nextSibling : list.firstChild;
            while (at && at.classList.contains("leaving")) at = at.nextSibling;
            if (at !== el) list.insertBefore(el, at);
            previous = el;
          });
          els.forEach(function (el, id) { if (!wanted.has(id)) fold(el, id); });
        }

        bridge.onState(draw);
      })();
    </script>
  </body>
</html>
