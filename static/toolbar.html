<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnotherNotes</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <style>
      :root {
        color-scheme: light dark;
        --bar: #f7f7f5; --ink: #37352f; --muted: rgba(55, 53, 47, .55); --hover: rgba(55, 53, 47, .07);
        --active: #ffffff; --edge: rgba(55, 53, 47, .09); --shade: 0 1px 2px rgba(0, 0, 0, .06);
      }
      :root.dark {
        --bar: #202020; --ink: rgba(255, 255, 255, .86); --muted: rgba(255, 255, 255, .46); --hover: rgba(255, 255, 255, .06);
        --active: rgba(255, 255, 255, .09); --edge: rgba(255, 255, 255, .08); --shade: none;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background: var(--bar); color: var(--ink);
        font: 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; cursor: default;
      }
      .bar {
        display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 var(--lights, 8px);
        border-bottom: 1px solid var(--edge); -webkit-app-region: drag;
      }
      body.over .bar { border-bottom-color: transparent; }
      body.hidden .bar { visibility: hidden; }
      button, .tab { -webkit-app-region: no-drag; }
      .icon {
        display: grid; place-items: center; flex: none; width: 28px; height: 28px; padding: 0;
        border: 0; border-radius: 6px; background: transparent; color: var(--ink);
      }
      .icon:hover:not(:disabled) { background: var(--hover); }
      .icon:disabled { color: var(--muted); opacity: .6; }
      .icon svg { width: 16px; height: 16px; }
      .nav { display: flex; gap: 2px; margin-right: 6px; }
      .tabs { display: flex; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; overflow: hidden; }
      .tab {
        position: relative; display: flex; align-items: center; gap: 6px; flex: 0 1 200px; width: 200px; min-width: 76px; height: 30px;
        padding: 0 6px 0 12px; border-radius: 8px; color: var(--muted); transition: background .12s, color .12s;
      }
      .tab:hover { background: var(--hover); color: var(--ink); }
      .tab.active { background: var(--active); color: var(--ink); box-shadow: var(--shade), inset 0 0 0 1px var(--edge); }
      .tab .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 30px; }
      .tab .close {
        display: grid; place-items: center; flex: none; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px;
        background: transparent; color: var(--muted); visibility: hidden;
      }
      .tab:hover .close, .tab.active .close { visibility: visible; }
      .tab .close:hover { background: var(--hover); color: var(--ink); }
      .tab .close svg { width: 10px; height: 10px; }
      #new { margin-left: 2px; }
    </style>
  </head>
  <body class="hidden">
    <div class="bar">
      <div class="nav">
        <button class="icon" id="back" type="button" title="Back (⌘[)" aria-label="Back" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5" /></svg>
        </button>
        <button class="icon" id="forward" type="button" title="Forward (⌘])" aria-label="Forward" disabled>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5" /></svg>
        </button>
      </div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Open notes"></div>
      <button class="icon" id="new" type="button" title="New note (⌘N)" aria-label="New note">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10" /></svg>
      </button>
    </div>
    <script>
      (function () {
        var bridge = window.tabbar;
        if (!bridge) return;
        var root = document.documentElement;
        var list = document.getElementById("tabs");
        var back = document.getElementById("back");
        var forward = document.getElementById("forward");
        var CLOSE = '<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="m2 2 6 6M8 2 2 8" /></svg>';

        back.addEventListener("click", function () { bridge.send("back"); });
        forward.addEventListener("click", function () { bridge.send("forward"); });
        document.getElementById("new").addEventListener("click", function () { bridge.send("new"); });

        /* The web app's sidebar colour, so the bar reads as part of the app. */
        function applyTheme(theme) {
          if (!theme || !theme.background) return;
          var m = theme.background.match(/\d+(\.\d+)?/g);
          var dark = theme.dark;
          if (m && m.length >= 3) {
            var lum = (0.2126 * m[0] + 0.7152 * m[1] + 0.0722 * m[2]) / 255;
            dark = lum < 0.5;
          }
          root.classList.toggle("dark", Boolean(dark));
          root.style.setProperty("--bar", theme.background);
        }

        function draw(state) {
          document.body.classList.toggle("hidden", !state.visible);
          document.body.classList.toggle("over", Boolean(state.overSidebar));
          root.style.setProperty("--lights", (state.inset || 8) + "px");
          applyTheme(state.theme);
          back.disabled = !state.canGoBack;
          forward.disabled = !state.canGoForward;
          list.textContent = "";
          state.tabs.forEach(function (tab) {
            var el = document.createElement("div");
            el.className = "tab" + (tab.active ? " active" : "");
            el.setAttribute("role", "tab");
            el.setAttribute("aria-selected", String(tab.active));
            el.title = tab.title;
            var title = document.createElement("span");
            title.className = "title";
            title.textContent = tab.title;
            var close = document.createElement("button");
            close.className = "close";
            close.type = "button";
            close.setAttribute("aria-label", "Close " + tab.title);
            close.innerHTML = CLOSE;
            close.addEventListener("click", function (e) { e.stopPropagation(); bridge.send("close", tab.id); });
            el.addEventListener("mousedown", function (e) { if (e.button === 0) bridge.send("select", tab.id); });
            el.addEventListener("auxclick", function (e) { if (e.button === 1) bridge.send("close", tab.id); });
            el.appendChild(title);
            el.appendChild(close);
            list.appendChild(el);
          });
        }

        bridge.onState(draw);
      })();
    </script>
  </body>
</html>
