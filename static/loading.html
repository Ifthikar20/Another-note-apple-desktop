<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AnotherNote</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
    <style>
      /*
        The loading screen: a pencil writes a note while a paper plane circles it, on white
        with a few colourful things about, like the sign-in screen. One loop is 2.8 s; the
        first line is written within the first half second, so even a short wait shows the
        idea. Everything is drawn here; nothing loads. Always light.
      */
      :root {
        color-scheme: light;
        --paper: #ffffff; --card: #ffffff; --ink: #2b2a27; --muted: #8a857d;
        --line: rgba(43, 42, 39, .14); --card-rule: rgba(56, 92, 160, .13); --tape: rgba(255, 206, 84, .85);
        --pencil: #f7c948; --pencil-dark: #dca82a; --wood: #f1d3a6; --lead: #3a3935; --eraser: #f59ab0; --metal: #cbc9c3;
        --plane: #eaf2ff; --plane-shade: #c4d7fb; --plane-ink: #2d4d8f;
        --leaf-1: #f5a623; --leaf-2: #ec6a3c; --leaf-3: #e6be2e; --leaf-4: #86c25a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; overflow: hidden;
        background-color: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none;
        -webkit-app-region: drag;
      }
      main { position: relative; z-index: 1; text-align: center; animation: rise .45s ease-out both; }

      /* The stage: the note, the pencil writing on it, the plane around it. */
      .stage { position: relative; width: 240px; height: 170px; margin: 0 auto 14px; }
      .note { position: absolute; inset: 0; z-index: 1; overflow: visible; }
      .n-shadow { fill: rgba(60, 40, 10, .14); }
      .n-card { fill: var(--card); stroke: var(--line); stroke-width: 1.4; }
      .n-rule { stroke: var(--card-rule); stroke-width: 1; }
      .n-tape { fill: var(--tape); }
      .w { fill: none; stroke: var(--ink); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1 1.5; stroke-dashoffset: 1.02; }
      .w1 { animation: w1 2.8s linear infinite; }
      .w2 { animation: w2 2.8s linear infinite; }
      .w3 { animation: w3 2.8s linear infinite; }
      @keyframes w1 { 0% { stroke-dashoffset: 1.02; opacity: 1 } 20% { stroke-dashoffset: 0 } 85% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
      @keyframes w2 { 0%, 25% { stroke-dashoffset: 1.02; opacity: 1 } 42% { stroke-dashoffset: 0 } 85% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }
      @keyframes w3 { 0%, 47% { stroke-dashoffset: 1.02; opacity: 1 } 58% { stroke-dashoffset: 0 } 85% { stroke-dashoffset: 0; opacity: 1 } 95%, 100% { stroke-dashoffset: 0; opacity: 0 } }

      /* The pencil's tip is its origin, so the path it follows is the line being written. */
      .writer { animation: write 2.8s infinite; }
      @keyframes write {
        0% { transform: translate(64px, 64px); animation-timing-function: linear; }
        20% { transform: translate(157.4px, 64px); animation-timing-function: ease-in-out; }
        25% { transform: translate(64px, 86px); animation-timing-function: linear; }
        42% { transform: translate(146.0px, 86px); animation-timing-function: ease-in-out; }
        47% { transform: translate(64px, 108px); animation-timing-function: linear; }
        58% { transform: translate(113.3px, 108px); animation-timing-function: ease-in-out; }
        66%, 85% { transform: translate(176px, 126px); animation-timing-function: ease-in-out; }
        100% { transform: translate(64px, 64px); }
      }
      .jot { animation: jot .16s ease-in-out infinite alternate; }
      @keyframes jot { from { transform: translateY(-1.6px); } to { transform: translateY(1.6px); } }
      .p-body { fill: var(--pencil); stroke: var(--ink); stroke-width: 1; }
      .p-facet { stroke: var(--pencil-dark); stroke-width: 1; }
      .p-wood { fill: var(--wood); stroke: var(--ink); stroke-width: 1; stroke-linejoin: round; }
      .p-lead { fill: var(--lead); }
      .p-metal { fill: var(--metal); stroke: var(--ink); stroke-width: 1; }
      .p-eraser { fill: var(--eraser); stroke: var(--ink); stroke-width: 1; }

      /* The plane circles the note: behind it on the far side, in front on the near one. */
      .plane {
        position: absolute; left: 0; top: 0; width: 36px; height: 24px; z-index: 0;
        offset-path: path("M 12 88 C 12 -4, 228 -4, 228 88 C 228 180, 12 180, 12 88");
        offset-rotate: auto;
        animation: orbit 3.6s linear infinite;
      }
      /* Nearer is bigger. On the inner drawing: a scale on the box on the path would scale
         the path's distance from the corner as well. */
      .plane svg { display: block; width: 100%; height: 100%; animation: nearer 3.6s linear infinite; }
      @keyframes orbit {
        0% { offset-distance: 0%; z-index: 0; }
        49.9% { z-index: 0; }
        50% { z-index: 2; }
        100% { offset-distance: 100%; z-index: 2; }
      }
      @keyframes nearer { 0% { transform: scale(.8); } 25% { transform: scale(.66); } 50% { transform: scale(.86); } 75% { transform: scale(1.1); } 100% { transform: scale(.8); } }
      .route { position: absolute; inset: 0; z-index: 0; overflow: visible; }
      .route path { fill: none; stroke: #7f9bd1; stroke-width: 1; stroke-dasharray: 3 5; opacity: .45; }
      .pl-top { fill: var(--plane); stroke: var(--plane-ink); stroke-width: 1.3; stroke-linejoin: round; }
      .pl-bottom { fill: var(--plane-shade); stroke: var(--plane-ink); stroke-width: 1.3; stroke-linejoin: round; }
      .pl-fold { stroke: var(--plane-ink); stroke-width: 1.1; }

      /* A star and a few dots of colour floating about. */
      .bit { position: fixed; z-index: 0; border-radius: 50%; animation: bob 4.6s ease-in-out infinite; }
      .star { position: fixed; z-index: 0; width: 20px; height: 20px; fill: rgba(245, 179, 1, .18); stroke: #f5b301; stroke-width: 2.2; stroke-linejoin: round; animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @keyframes twinkle { 0%, 100% { transform: scale(.85) rotate(-8deg); opacity: .6; } 50% { transform: scale(1.1) rotate(8deg); opacity: 1; } }

      .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0 0 4px; }
      .brand .mark { width: 22px; height: 22px; border-radius: 6px; box-shadow: 0 3px 8px rgba(0, 0, 0, .14); }
      .brand span { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
      .sub { margin: 0; color: var(--muted); font-size: 13px; }

      /* A couple of leaves drifting past. */
      .leaf { position: fixed; top: 0; left: var(--x); width: var(--size); height: var(--size); z-index: 0; animation: fall var(--dur) linear var(--delay) infinite; }
      .leaf .sway { width: 100%; height: 100%; animation: sway var(--sway-dur) ease-in-out infinite alternate; }
      .leaf svg { width: 100%; height: 100%; display: block; }
      .l-body { stroke: rgba(0, 0, 0, .12); stroke-width: 1; }
      .l-vein { fill: none; stroke: rgba(0, 0, 0, .18); stroke-width: 1; stroke-linecap: round; }
      .c0 .l-body { fill: var(--leaf-1); } .c1 .l-body { fill: var(--leaf-2); } .c2 .l-body { fill: var(--leaf-3); } .c3 .l-body { fill: var(--leaf-4); }
      @keyframes fall {
        0% { transform: translate3d(0, -30px, 0) rotate(0deg); opacity: 0; }
        10%, 88% { opacity: .9; }
        100% { transform: translate3d(var(--drift), 410px, 0) rotate(var(--spin)); opacity: 0; }
      }
      @keyframes sway { from { transform: translateX(-14px) rotate(-22deg); } to { transform: translateX(14px) rotate(22deg); } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; }
        .w { stroke-dashoffset: 0; }
        .writer { transform: translate(176px, 126px); }
        .plane, .leaf, .route { display: none; }
      }
    </style>
  </head>
