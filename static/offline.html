<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AnotherNote</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, system-ui, "Segoe UI", sans-serif; text-align: center;
        background: #fff9f0; color: #1e1e1e;
      }
      .card { max-width: 420px; padding: 32px; }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 20px; opacity: .72; line-height: 1.5; font-size: 15px; }
      button {
        font: inherit; font-size: 14px; padding: 10px 22px; border-radius: 999px; border: 0;
        background: #1e1e1e; color: #fff; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1e1e; color: #f5f1ea; }
        button { background: #f5f1ea; color: #1e1e1e; }
      }
    </style>
    <style>.titlebar { position: fixed; top: 0; left: 0; right: 0; height: 40px; -webkit-app-region: drag; z-index: 10; }</style>
  </head>
  <body>
    <div class="titlebar" aria-hidden="true"></div>
    <div class="card">
      <h1>Can't reach AnotherNote</h1>
      <p id="why">Check your internet connection. This page tries again on its own.</p>
      <button id="retry" type="button">Try again</button>
    </div>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var url = q.get("url") || "https://anothernote.app/dashboard";
        var why = q.get("why");
        var title = q.get("title");
        if (title) document.querySelector("h1").textContent = title;
        if (why) document.getElementById("why").textContent = why + ". This page tries again on its own.";
        var retry = function () { location.href = url; };
        document.getElementById("retry").addEventListener("click", retry);
        setTimeout(retry, 15000);
      })();
    </script>
  </body>
</html>
